name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with .NET Framework csc
        shell: pwsh
        run: |
          $netPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $wpfPath = "$netPath\WPF"
          & "$netPath\csc.exe" /nologo /target:winexe /optimize+ `
            "/win32icon:omnidict.ico" `
            "/r:$wpfPath\PresentationFramework.dll" `
            "/r:$wpfPath\PresentationCore.dll" `
            "/r:$wpfPath\WindowsBase.dll" `
            "/r:$netPath\System.Xaml.dll" `
            "/r:$netPath\System.dll" `
            "/r:$netPath\System.Security.dll" `
            "/r:$netPath\System.Windows.Forms.dll" `
            "/r:$netPath\System.Drawing.dll" `
            /out:"OmniDict.exe" "Program.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item OmniDict.exe | Format-List Name, Length
          Compress-Archive -Path OmniDict.exe -DestinationPath OmniDict.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OmniDict
          path: OmniDict.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmniDict.zip
